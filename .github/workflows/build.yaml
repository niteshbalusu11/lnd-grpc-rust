name: Rust CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check_format:
    name: Check Rust Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        if: runner.os != 'Windows'
        run: cargo build
      - name: Build on Windows
        if: runner.os == 'Windows'
        run: cargo build --features vendored-openssl
      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: cargo test --features vendored-openssl
